name: Pharma and pharmaceutical development tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stock analytics tests
        run: python -m unittest discover -s 09-PRODUCTS/Pharma-Stock-Intelligence/tests -v
      - name: Run medicine master data tests
        run: python -m unittest discover -s 09-PRODUCTS/Medicine-Data-Cleaner/tests -v
      - name: Run drug development workbench tests
        run: python -m unittest discover -s 09-PRODUCTS/Drug-Development-Workbench/tests -v
