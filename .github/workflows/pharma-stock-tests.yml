name: Pharma stock MVP tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library unit tests
        run: python -m unittest discover -s 09-PRODUCTS/Pharma-Stock-Intelligence/tests -v
